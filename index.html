<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Viewer</title>
<style>
:root {
  /* LIGHT = outdoor / direct sunlight: pure white, near-black text, strong contrast and borders */
  color-scheme: light;
  --page:#ffffff; --surface:#ffffff; --surface-2:#eceef3; --text:#05070b; --text-2:#242a35; --muted:#4f5668;
  --grid:#c3c9d4; --axis:#7d869a; --border:rgba(5,7,11,.34); --accent:#0a4fc4; --accent-2:#0a4fc4; --accent-bg:rgba(10,79,196,.14);
  --sel:rgba(10,79,196,.26); --zebra:rgba(5,7,11,.05); --hover:rgba(10,79,196,.10); --bad:#b3261e;
  --glow:none; --shadow:0 1px 2px rgba(0,0,0,.18); --head:#e4e7ee; --cell-w:500;
  --ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
:root[data-theme="dark"] { /* DARK = indoor work: deep ink background, soft contrast, blue-violet accent */
  color-scheme: dark;
  --page:#0a0d14; --surface:#10141d; --surface-2:#161b27; --text:#e7eaf3; --text-2:#aab2c8; --muted:#6c7692;
  --grid:#1b2130; --axis:#2b3449; --border:rgba(140,160,215,.17); --accent:#82a8ff; --accent-2:#b18cff; --accent-bg:rgba(130,168,255,.14);
  --sel:rgba(130,168,255,.24); --zebra:rgba(255,255,255,.022); --hover:rgba(130,168,255,.08); --bad:#ff7b7b;
  --glow:0 0 0 1px rgba(130,168,255,.55), 0 0 14px rgba(130,168,255,.28); --shadow:0 6px 24px rgba(0,0,0,.45); --head:#131826; --cell-w:400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --page:#0a0d14; --surface:#10141d; --surface-2:#161b27; --text:#e7eaf3; --text-2:#aab2c8; --muted:#6c7692;
    --grid:#1b2130; --axis:#2b3449; --border:rgba(140,160,215,.17); --accent:#82a8ff; --accent-2:#b18cff; --accent-bg:rgba(130,168,255,.14);
    --sel:rgba(130,168,255,.24); --zebra:rgba(255,255,255,.022); --hover:rgba(130,168,255,.08); --bad:#ff7b7b;
    --glow:0 0 0 1px rgba(130,168,255,.55), 0 0 14px rgba(130,168,255,.28); --shadow:0 6px 24px rgba(0,0,0,.45); --head:#131826; --cell-w:400;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--text); font: 13px/1.4 var(--ui); font-feature-settings: "cv11","ss01"; -webkit-font-smoothing: antialiased; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100%; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .2px; margin-right: 4px; }
.fname { color: var(--text-2); max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { flex: 1; }
input[type=search], select, button { font: inherit; color: var(--text); background: var(--page); border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px; }
input[type=search] { width: min(34vw, 340px); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); cursor: pointer; user-select: none; }
.bad { border-color: var(--bad) !important; }
#prog { height: 2px; background: transparent; flex: none; }
#prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
#work { flex: 1; min-height: 0; display: flex; }
#main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
#head { position: relative; height: 70px; flex: none; overflow: hidden; background: var(--surface-2); border-bottom: 1px solid var(--axis); }
#hg { position: absolute; left: 0; top: 0; width: 60px; height: 100%; z-index: 3; background: var(--surface-2); border-right: 1px solid var(--grid);
  color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 11px; }
#hin { position: absolute; left: 0; top: 0; height: 100%; }
.hc { position: absolute; top: 0; height: 34px; padding: 0 26px 0 8px; display: flex; align-items: center; gap: 4px; font-weight: 600;
  border-right: 1px solid var(--grid); cursor: pointer; user-select: none; }
.hc:hover { background: var(--hover); }
.hc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.hc .ar { color: var(--accent); font-size: 10px; }
.hc .sg { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); line-height: 15px; height: 20px; opacity: 0; border: 0; background: transparent; padding: 1px 4px; border-radius: 6px; color: var(--muted); font-size: 12px; }
.hc:hover .sg, .hc .sg:focus-visible { opacity: 1; }
.hc:hover .sg { opacity: 1; }
.rz { position: absolute; right: -3px; top: 0; width: 7px; height: 100%; cursor: col-resize; z-index: 2; }
.rz:hover, .rz.drag { background: var(--accent); opacity: .5; }
.fc { position: absolute; top: 34px; height: 36px; padding: 6px 4px; box-sizing: border-box; border-right: 1px solid var(--grid); }
.fc { display: flex; gap: 3px; }
.fc input { flex: 1; min-width: 0; width: auto; height: 24px; padding: 0 6px; font: inherit; font-size: 12px; background: var(--page); color: var(--text); border: 1px solid var(--border); border-radius: 5px; }
.fc input::placeholder { color: var(--muted); }
#scroller { flex: 1; min-height: 0; overflow: auto; position: relative; outline: none; }
#scroller:focus, #scroller:focus-visible { outline: none; }
#spacer { position: relative; }
#layer { position: sticky; top: 0; left: 0; overflow: hidden; }
.r { position: absolute; left: 0; right: 0; height: var(--rowh, 26px); border-bottom: 1px solid var(--grid); }
.r.odd { background: var(--zebra); }
.r:hover { background: var(--hover); }
.g { position: absolute; left: 0; top: 0; width: 60px; height: 100%; z-index: 2; background: var(--surface-2); color: var(--muted);
  font-size: 11px; text-align: right; padding: 0 8px; line-height: 25px; border-right: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.c { position: absolute; top: 0; height: 100%; padding: 0 8px; line-height: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.c.sel { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--accent); }
.r.rsel .g { color: var(--accent); font-weight: 600; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
#empty .box { max-width: 460px; width: 100%; text-align: center; padding: 44px 24px; border: 2px dashed var(--axis); border-radius: 14px; background: var(--surface); cursor: pointer; }
#empty .box:hover, body.drag #empty .box { border-color: var(--accent); background: var(--accent-bg); }
#empty h2 { margin: 0 0 6px; font-size: 18px; }
#empty p { margin: 4px 0; color: var(--text-2); }
#nores { position: absolute; left: 60px; right: 0; top: 80px; text-align: center; color: var(--muted); pointer-events: none; }
#detail { width: 360px; flex: none; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
#detail[hidden] { display: none; }
#detail header { padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
#dlist { overflow: auto; padding: 4px 0 12px; flex: 1; }
.kv { padding: 5px 12px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.kv:hover { background: var(--hover); }
.kv .k { color: var(--muted); font-size: 11px; }
.kv .v { font: 12px/1.45 ui-monospace, Consolas, monospace; word-break: break-all; white-space: pre-wrap; max-height: 9em; overflow: auto; }
.kv.cur { background: var(--accent-bg); }
#status { flex: none; display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px; background: var(--surface); border-top: 1px solid var(--border); color: var(--text-2); font-size: 12px; }
#status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(560px, 92vw); max-height: 80vh; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { flex: none; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
dialog h3 { margin: 0; font-size: 15px; }
#dbody { padding: 8px 16px 16px; overflow: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.sr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; position: relative; }
.sr:hover { background: var(--hover); }
.sr .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr .n { color: var(--text-2); font-variant-numeric: tabular-nums; }
.sr .bar2 { grid-column: 1 / 3; height: 3px; border-radius: 2px; background: var(--accent); opacity: .55; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.c.n { text-align: right; }
.ty { font-size: 10px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 15px; cursor: pointer; }
.ty:hover { color: var(--accent); border-color: var(--accent); }
.fc .vp { width: 24px; height: 24px; padding: 0; font-size: 11px; line-height: 1; color: var(--text-2); }
.fc .vp.set { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fc input.set { border-color: var(--accent); background: var(--accent-bg); }
.fc input.set::placeholder { color: var(--accent); }
.kv .u { color: var(--accent); font: 11px ui-monospace, Consolas, monospace; margin-top: 2px; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.ctl input[type=search] { flex: 1; min-width: 140px; width: auto; }
.sum { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 12px; margin: 6px 0 4px; color: var(--text-2); }
.sum b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.sr input { margin-right: 6px; }
.sr { grid-template-columns: 1fr auto; }
label.sr { align-items: center; }
#toast { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--page); padding: 6px 12px; border-radius: 8px;
  font-size: 12px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 10; }
#toast.show { opacity: 1; }
@media (max-width: 720px) { #detail { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; width: min(360px, 90vw); } .fname { display: none; } }

/* ---- time range ---- */
#trange { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
.trrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.trrow label { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); }
.trrow button { padding: 3px 9px; }
.trrow .tz { color: var(--muted); font-size: 11px; }
.tin { width: 172px; font: 12px var(--mono); background: var(--page); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.tin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.chips { display: inline-flex; gap: 4px; }
#trcv { width: 100%; height: 78px; display: block; touch-action: none; cursor: crosshair; border-radius: 8px; background: var(--page); border: 1px solid var(--border); }
#trinfo { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
/* ---- multi-cell selection ---- */
#layer { user-select: none; -webkit-user-select: none; }
.c.rg { background: var(--sel); }
.g.in { color: var(--accent); font-weight: 600; }
#st2 { display: inline-flex; align-items: center; gap: 8px; }
#st2 button { padding: 0 8px; font-size: 11px; line-height: 18px; border-radius: 6px; }
/* ---- wrap mode ---- */
#layer.wrap .c { line-height: 18px; padding: 4px 8px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: var(--lines, 4); line-clamp: var(--lines, 4); overflow: hidden; text-overflow: clip; }
#layer.wrap .g { line-height: 18px; padding-top: 4px; }
/* ---- polish ---- */
html { scrollbar-color: var(--axis) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--axis); border-radius: 8px; border: 3px solid var(--page); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
::-webkit-scrollbar-corner { background: transparent; }
::selection { background: var(--accent-bg); }
.bar { box-shadow: var(--shadow); position: relative; z-index: 4; gap: 8px; }
.brand { font-weight: 700; letter-spacing: .3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
input[type=search], select, button { border-radius: 9px; transition: background .12s, border-color .12s, box-shadow .12s; }
input[type=search]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
button:active { transform: translateY(1px); }
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
#prog i { background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent); }
#head { background: var(--head); }
#hg { background: var(--head); }
.hc { letter-spacing: .1px; }
.hc .nm { font-weight: 600; }
.c, .g { font-family: var(--mono); font-size: 12.5px; font-weight: var(--cell-w); }
.g { font-size: 11px; }
.c.sel { box-shadow: var(--glow), inset 0 0 0 1.5px var(--accent); background: var(--sel); border-radius: 3px; }
.kv .v, .sum b { font-family: var(--mono); }
#detail, dialog { box-shadow: var(--shadow); }
dialog { border-radius: 14px; }
#empty .box { background: linear-gradient(160deg, var(--surface), var(--surface-2)); border-radius: 18px; box-shadow: var(--shadow); }
#empty h2 { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 22px; }
#toast { box-shadow: var(--shadow); }
#bthm { min-width: 84px; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="brand">CSV Viewer</span><span class="fname" id="fname"></span>
    <input type="search" id="q" placeholder="Search all columns  ( / )" aria-label="Search all columns" disabled>
    <button id="bre" title="Regular expression" disabled>.*</button>
    <button id="bcase" title="Match case" disabled>Aa</button>
    <label class="chk"><input type="checkbox" id="hdr" checked disabled> Header</label>
    <select id="dsel" title="Delimiter" disabled>
      <option value="">Auto</option><option value=",">Comma</option><option value=";">Semicolon</option>
      <option value="&#9;">Tab</option><option value="|">Pipe</option>
    </select>
    <span class="sp"></span>
    <button id="btr" disabled title="Select a time range on a timestamp column">Time range</button>
    <button id="bwrap" disabled title="Wrap long values over several lines instead of cutting them off">Wrap</button>
    <button id="bcols" disabled title="Choose which columns to show / export">Columns</button>
    <button id="bdet" disabled>Details</button>
    <button id="bexp" disabled>Export view</button>
    <button id="bthm" title="Toggle theme">Theme</button>
    <button id="bopen">Open…</button>
    <input type="file" id="file" accept=".csv,.tsv,.txt,.tab,.log,text/*" hidden>
  </div>
  <div id="prog"><i></i></div>
  <section id="trange" hidden aria-label="Time range">
    <div class="trrow">
      <strong>Time range</strong>
      <select id="trcol" aria-label="Timestamp column"></select>
      <label>From <input id="trfrom" class="tin" placeholder="YYYY-MM-DD HH:mm:ss" spellcheck="false" autocomplete="off"></label>
      <label>To <input id="trto" class="tin" placeholder="YYYY-MM-DD HH:mm:ss" spellcheck="false" autocomplete="off"></label>
      <span class="tz">UTC</span>
      <span class="chips" id="trchips" title="Relative to the last timestamp of the data">
        <button data-p="3600000">1 h</button><button data-p="21600000">6 h</button><button data-p="86400000">24 h</button><button data-p="604800000">7 d</button>
      </span>
      <button id="trprev" title="Previous window of the same length">◀</button><button id="trnext" title="Next window of the same length">▶</button>
      <button id="trzin" title="Zoom the chart to the selected range">Zoom to selection</button><button id="trzout">Full range</button>
      <span class="sp"></span><span id="trinfo"></span>
      <button id="trclear" title="Remove the time filter">Clear</button><button id="trx" aria-label="Close time range">✕</button>
    </div>
    <canvas id="trcv" aria-label="Rows over time: drag to select a range, drag its edges or body to adjust, click to clear"></canvas>
  </section>
  <div id="work">
    <div id="main">
      <div id="head" hidden><div id="hg">#</div><div id="hin"></div></div>
      <div id="scroller" tabindex="0" hidden><div id="spacer"><div id="layer"></div></div><div id="nores" hidden>No matching rows</div></div>
      <div id="empty"><div class="box" id="drop">
        <h2>Drop a CSV / TSV file here</h2>
        <p>or click to open · or paste text (Ctrl+V)</p>
        <p style="font-size:12px;color:var(--muted)">Everything stays in your browser, nothing is uploaded.<br>
        Millions of rows: sorting, search, per-column filters.</p>
      </div></div>
    </div>
    <aside id="detail" hidden><header><span id="dtitle">Row</span><button id="dclose" aria-label="Close">✕</button></header><div id="dlist"></div></aside>
  </div>
  <div id="status"><span id="st1">Ready</span><span id="st2"></span></div>
</div>
<dialog id="dlg"><header><h3 id="dh"></h3><button id="dx">Close</button></header><div id="dbody"></div></dialog>
<div id="toast"></div>
<script>
"use strict";
let ROW_H = 26;                       // 26 px, or 80 px when "Wrap" is on (4 lines)
const GUTTER = 60, MAXH = 8e6, WRAP_LINES = 4, WRAP_ROW_H = WRAP_LINES * 18 + 8;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmtN = n => n.toLocaleString("en-US");
const fmtB = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : b < 1073741824 ? (b / 1048576).toFixed(1) + " MB" : (b / 1073741824).toFixed(2) + " GB";
const tick = () => new Promise(r => setTimeout(r, 0));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let T = null;          // loaded dataset
let loadGen = 0, gen = 0;
let reOn = false, caseOn = false;

// ---------------------------------------------------------------- csv parsing
function parseRow(s, d) {
  if (s.indexOf('"') < 0) return s.split(d);
  const out = [], L = s.length;
  let i = 0;
  while (i <= L) {
    if (s.charCodeAt(i) === 34) {
      let j = i + 1, buf = "";
      for (;;) {
        const k = s.indexOf('"', j);
        if (k < 0) { buf += s.slice(j); i = L; break; }
        if (s.charCodeAt(k + 1) === 34) { buf += s.slice(j, k + 1); j = k + 2; continue; }
        buf += s.slice(j, k); i = k + 1; break;
      }
      const k2 = s.indexOf(d, i);
      if (k2 < 0) { out.push(buf + s.slice(i)); return out; }
      out.push(buf + s.slice(i, k2)); i = k2 + 1;
      if (i === L) { out.push(""); return out; }
    } else {
      const k = s.indexOf(d, i);
      if (k < 0) { out.push(s.slice(i)); return out; }
      out.push(s.slice(i, k)); i = k + 1;
      if (i === L) { out.push(""); return out; }
    }
  }
  return out;
}

function setProg(f, label) {
  $("prog").firstElementChild.style.width = f == null ? "0" : Math.round(f * 100) + "%";
  if (label) $("st1").textContent = label;
}

async function indexRecords(text, isCurrent) {
  let cap = 1 << 20, st = new Float64Array(cap), en = new Float64Array(cap), n = 0;
  const L = text.length;
  let i = 0, start = 0, inQ = false;
  const push = (a, b) => {
    if (b <= a) return;
    if (n === cap) {
      cap *= 2;
      const s2 = new Float64Array(cap), e2 = new Float64Array(cap);
      s2.set(st); e2.set(en); st = s2; en = e2;
    }
    st[n] = a; en[n] = b; n++;
  };
  while (i < L) {
    const lim = Math.min(L, i + 4000000);
    for (; i < lim; i++) {
      const c = text.charCodeAt(i);
      if (c === 34) inQ = !inQ;
      else if (c === 10 && !inQ) {
        let e = i;
        if (e > start && text.charCodeAt(e - 1) === 13) e--;
        push(start, e); start = i + 1;
      }
    }
    setProg(0.4 + 0.6 * i / L, "Indexing… " + fmtN(n) + " rows");
    await tick();
    if (!isCurrent()) return null;
  }
  if (start < L) { let e = L; if (text.charCodeAt(e - 1) === 13) e--; push(start, e); }
  return {st: st.subarray(0, n), en: en.subarray(0, n), n};
}

function detectDelim(t) {
  let best = ",", bestScore = -1;
  for (const d of [",", ";", "\t", "|"]) {

// ---------------------------------------------------------------- typing: integer / float / timestamp
const RE_INT = /^[+-]?(0|[1-9]\d{0,17})$/;

// ---------------------------------------------------------------- column filter language
//   text            contains (case-insensitive)      !text      does not contain
//   =x   !=x        equals / differs                 =  !       empty / non-empty
//   >5 >=5 <5 <=5   numbers; for timestamps: >2026-09-28  <=2026-09-28 10:30   (bare date = whole day)

    $("chint").textContent = t.hidden.filter(x => !x).length + " of " + t.nc + " columns shown · applies to the grid and to “Export view”";
  };
  const forMatching = fn => { const q = query.toLowerCase(); t.cols.forEach((name, c) => { if (!q || name.toLowerCase().includes(q)) t.hidden[c] = fn(t.hidden[c]); }); apply(); };
  $("clist").onchange = e => { const cb = e.target.closest("input[type=checkbox]"); if (!cb) return; t.hidden[+cb.dataset.c] = !cb.checked; apply(); };
  $("cq").oninput = e => { query = e.target.value; list(); };
  $("call").onclick = () => forMatching(() => false);
  $("cnone").onclick = () => forMatching(() => true);
  $("cinv").onclick = () => forMatching(h => !h);
  list();
  $("dlg").showModal();
}
$("bcols").addEventListener("click", showColumns);
$("dx").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

// ---------------------------------------------------------------- time range (histogram brush on a timestamp column)
const tr = {open: false, c: -1, min: 0, max: 0, dlo: 0, dhi: 1, bins: 200, counts: null, sel: null, drag: null};
const timeCols = () => T ? T.cols.map((_, c) => c).filter(c => T.types[c] === "time" || T.types[c] === "epoch") : [];
const shortTs = ms => { const x = fmtTs(ms); return x.endsWith(".000Z") ? x.slice(0, -5) : x.slice(0, -1); };   // YYYY-MM-DD HH:mm:ss[.sss], UTC
const trUnit = () => { const sp = tr.dhi - tr.dlo; return sp > 2 * 86400000 ? 60000 : sp > 3 * 3600000 ? 1000 : 1; };
const trSnap = ms => { const u = trUnit(); return Math.round(ms / u) * u; };

function trOnLoad() { tr.c = -1; tr.sel = null; tr.counts = null; if (tr.open) trSetup(); trInfo(); }
function trTypeChanged(c) {
  if (T.tr && T.tr.c === c && !timeCols().includes(c)) T.tr = null;
  if (tr.open) trSetup();
}
async function toggleTr() {
  if (tr.open) { tr.open = false; $("trange").hidden = true; trInfo(); return; }
  if (!timeCols().length) { toast("No timestamp column detected. Click a column's type badge to set one."); return; }
  tr.open = true; $("trange").hidden = false;
  await trSetup();
}
async function trSetup() {
  const cols = timeCols();
  if (!cols.length) { tr.open = false; $("trange").hidden = true; trInfo(); return; }
  $("trcol").innerHTML = cols.map(c => '<option value="' + c + '">' + esc(T.cols[c]) + "</option>").join("");
  let c = cols.includes(tr.c) ? tr.c : T.tr ? T.tr.c : T.sort && cols.includes(T.sort.c) ? T.sort.c : cols[0];
  await trSetCol(c);
}
async function trSetCol(c) {
  const t = T, x = await typedColumn(c, null);
  setProg(null);
  if (!x || T !== t) return;
  tr.c = c; $("trcol").value = c;
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < x.length; i++) { const v = x[i]; if (v === v) { if (v < mn) mn = v; if (v > mx) mx = v; } }
  if (!(mn <= mx)) { tr.counts = null; $("trinfo").textContent = "no parsable timestamps in this column"; return; }
  tr.min = mn; tr.max = mx; tr.dlo = mn; tr.dhi = mx > mn ? mx : mn + 1;
  tr.sel = t.tr && t.tr.c === c ? {lo: t.tr.lo, hi: t.tr.hi} : null;
  trCount(); trFill(); trDraw(); trInfo();
}
function trCount() {
  const x = T.typed.get(tr.c), n = tr.bins, counts = new Uint32Array(n), span = tr.dhi - tr.dlo;
  if (x) for (let i = 0; i < x.length; i++) {
    const v = x[i];
    if (v >= tr.dlo && v <= tr.dhi) counts[Math.min(n - 1, ((v - tr.dlo) / span * n) | 0)]++;
  }
  tr.counts = counts;
}
function trFill() {
  const s = tr.sel;
  $("trfrom").value = s && isFinite(s.lo) ? shortTs(s.lo) : "";
  $("trto").value = s && isFinite(s.hi) ? shortTs(s.hi) : "";
  $("trfrom").classList.remove("bad"); $("trto").classList.remove("bad");
}
function trInfo() {
  const b = $("btr");
  if (!T) return;
  b.classList.toggle("on", !!T.tr || tr.open);
  if (tr.open && tr.counts) $("trinfo").textContent = T.tr ? fmtN(T.nView) + " of " + fmtN(nData(T)) + " rows in range" : fmtN(nData(T)) + " rows · drag on the chart to select";
}
function trDraw() {
  if (!tr.open || !tr.counts) return;
  const cv = $("trcv"), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const accent = col("--accent"), axis = col("--axis"), muted = col("--muted"), grid = col("--grid");
  const top = 6, bot = H - 16, bh = bot - top, n = tr.counts.length, bw = W / n, span = tr.dhi - tr.dlo;
  let max = 1;
  for (const v of tr.counts) if (v > max) max = v;
  const xOf = ms => (ms - tr.dlo) / span * W, sel = tr.sel;
  const sx0 = sel ? Math.max(0, xOf(sel.lo)) : 0, sx1 = sel ? Math.min(W, xOf(sel.hi)) : W;
  g.strokeStyle = grid; g.lineWidth = 1;
  for (let k = 1; k < 4; k++) { const y = Math.round(top + bh * k / 4) + .5; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  for (let i = 0; i < n; i++) {
    const v = tr.counts[i]; if (!v) continue;
    const h = Math.max(1.5, v / max * bh), x = i * bw, inside = !sel || (x + bw > sx0 && x < sx1);
    g.globalAlpha = inside ? 0.92 : 0.5; g.fillStyle = inside ? accent : axis;
    g.fillRect(x + .5, bot - h, Math.max(1, bw - 1), h);
  }
  g.globalAlpha = 1;
  g.strokeStyle = axis; g.beginPath(); g.moveTo(0, bot + .5); g.lineTo(W, bot + .5); g.stroke();
  // ticks
  const f = span < 3 * 3600000 ? ms => fmtTs(ms).slice(11, 19) : span < 2 * 86400000 ? ms => fmtTs(ms).slice(11, 16)
    : span < 60 * 86400000 ? ms => fmtTs(ms).slice(5, 16) : ms => fmtTs(ms).slice(0, 10);
  g.fillStyle = muted; g.font = "10px " + (col("--mono") || "monospace");
  const nt = Math.max(2, Math.min(7, Math.floor(W / 110)));
  for (let k = 0; k < nt; k++) {
    const fr = k / (nt - 1), lab = f(tr.dlo + fr * span), tw = g.measureText(lab).width;
    g.textAlign = k === 0 ? "left" : k === nt - 1 ? "right" : "center";
    g.fillText(lab, k === 0 ? 2 : k === nt - 1 ? W - 2 : fr * W, H - 4);
  }
  if (sel) {
    g.fillStyle = accent; g.globalAlpha = .13; g.fillRect(sx0, top, Math.max(1, sx1 - sx0), bh); g.globalAlpha = 1;
    g.fillStyle = accent;
    if (isFinite(sel.lo) && sx0 > 0) { g.fillRect(sx0 - 1, top, 2, bh); g.fillRect(sx0 - 4, top + bh / 2 - 9, 8, 18); }
    if (isFinite(sel.hi) && sx1 < W) { g.fillRect(sx1 - 1, top, 2, bh); g.fillRect(sx1 - 4, top + bh / 2 - 9, 8, 18); }
  }
}
function applyRange(lo, hi) {
  if (lo > hi) [lo, hi] = [hi, lo];
  T.tr = {c: tr.c, lo, hi}; tr.sel = {lo, hi};
  trFill(); trDraw(); refresh();
}
function clearRange() {
  if (!T.tr && !tr.sel) return;
  const had = !!T.tr;
  T.tr = null; tr.sel = null; trFill(); trDraw();
  if (had) refresh(); else trInfo();
}
function trFromInputs() {
  const a = $("trfrom").value.trim(), b = $("trto").value.trim();
  if (!a && !b) { clearRange(); return; }
  const dmy = T.dmy[tr.c];
  const P = (x, end) => {
    if (!x) return end ? Infinity : -Infinity;
    const r = parseTsFull(x, dmy);
    if (r) return end ? r.ms + (r.span > 1 ? r.span - 1 : 0) : r.ms;      // a bare date as "To" includes the whole day
    return parseEpoch(x);
  };
  const lo = P(a, false), hi = P(b, true);
  $("trfrom").classList.toggle("bad", lo !== lo); $("trto").classList.toggle("bad", hi !== hi);
  if (lo !== lo || hi !== hi) return;
  applyRange(lo, hi);
}
const trX = e => { const r = $("trcv").getBoundingClientRect(); return Math.max(0, Math.min(r.width, e.clientX - r.left)); };
const trXOf = ms => (ms - tr.dlo) / (tr.dhi - tr.dlo) * $("trcv").clientWidth;
const trT = px => tr.dlo + px / $("trcv").clientWidth * (tr.dhi - tr.dlo);
$("trcv").addEventListener("pointerdown", e => {
  if (!tr.counts) return;
  const px = trX(e), sel = tr.sel;
  let mode = "new", anchor = trSnap(trT(px)), orig = null;
  if (sel) {
    const xl = trXOf(sel.lo), xh = trXOf(sel.hi);
    if (Math.abs(px - xl) <= 7) { mode = "lo"; anchor = sel.hi; }
    else if (Math.abs(px - xh) <= 7) { mode = "hi"; anchor = sel.lo; }
    else if (isFinite(sel.lo) && isFinite(sel.hi) && px > xl && px < xh) { mode = "move"; anchor = trT(px); orig = {lo: sel.lo, hi: sel.hi}; }
  }
  tr.drag = {mode, anchor, px0: px, moved: false, orig};
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
});
$("trcv").addEventListener("pointermove", e => {
  const cv = e.currentTarget, px = trX(e), d = tr.drag;
  if (!tr.counts) return;
  if (d) {
    if (Math.abs(px - d.px0) > 2) d.moved = true;
    if (!d.moved) return;
    const t = trSnap(trT(px));
    if (d.mode === "move") { const dt = trSnap(trT(px) - d.anchor); tr.sel = {lo: d.orig.lo + dt, hi: d.orig.hi + dt}; }
    else tr.sel = {lo: Math.min(d.anchor, t), hi: Math.max(d.anchor, t)};
    trFill(); trDraw(); return;
  }
  const sel = tr.sel;
  let cur = "crosshair";
  if (sel && (Math.abs(px - trXOf(sel.lo)) <= 7 || Math.abs(px - trXOf(sel.hi)) <= 7)) cur = "ew-resize";
  else if (sel && isFinite(sel.lo) && isFinite(sel.hi) && px > trXOf(sel.lo) && px < trXOf(sel.hi)) cur = "grab";
  cv.style.cursor = cur;
  const b = Math.min(tr.counts.length - 1, Math.floor(px / cv.clientWidth * tr.counts.length));
  $("trinfo").textContent = shortTs(trT(px)) + " UTC · " + fmtN(tr.counts[b]) + " rows in this bar";
});
$("trcv").addEventListener("pointerup", () => {
  const d = tr.drag; tr.drag = null;
  if (!d) return;
  if (d.moved && tr.sel) applyRange(tr.sel.lo, tr.sel.hi);
  else if (d.mode === "new") clearRange();
});
$("trcv").addEventListener("pointercancel", () => { tr.drag = null; });
$("trcv").addEventListener("pointerleave", () => { if (!tr.drag) trInfo(); });
for (const id of ["trfrom", "trto"]) {
  $(id).addEventListener("change", trFromInputs);
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") trFromInputs(); });
}
$("trcol").addEventListener("change", e => {
  const c = +e.target.value;
  if (T.tr && T.tr.c !== c) { T.tr = null; refresh(); }
  trSetCol(c);
});
$("trchips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !tr.counts) return;
  applyRange(tr.max - +b.dataset.p, tr.max);
});
function trShift(dir) {
  const s = tr.sel;
  if (!s || !isFinite(s.lo) || !isFinite(s.hi)) { toast("Select a range first"); return; }
  const w = s.hi - s.lo + 1;
  applyRange(s.lo + dir * w, s.hi + dir * w);
}
$("trprev").addEventListener("click", () => trShift(-1));
$("trnext").addEventListener("click", () => trShift(1));
$("trzin").addEventListener("click", () => {
  const s = tr.sel;
  if (!s) { toast("Select a range first"); return; }
  const lo = isFinite(s.lo) ? Math.max(s.lo, tr.min) : tr.min, hi = isFinite(s.hi) ? Math.min(s.hi, tr.max) : tr.max;
  if (!(hi > lo)) return;
  tr.dlo = lo; tr.dhi = hi; trCount(); trDraw();
});
$("trzout").addEventListener("click", () => { tr.dlo = tr.min; tr.dhi = tr.max > tr.min ? tr.max : tr.min + 1; trCount(); trDraw(); });
$("trclear").addEventListener("click", clearRange);
$("trx").addEventListener("click", toggleTr);
$("btr").addEventListener("click", toggleTr);
new ResizeObserver(() => trDraw()).observe($("trcv"));

// ---------------------------------------------------------------- wrap toggle (rows get a fixed taller height, long values wrap over WRAP_LINES lines)
let wrapOn = false;
function applyRowH(rh) {
  if (rh === ROW_H) return;
  const keep = T && T.nView ? geom().first : 0;
  ROW_H = rh;
  document.documentElement.style.setProperty("--rowh", ROW_H + "px");
  if (T) {
    updateSpacer();
    const sc = $("scroller"), n = T.nView, full = n * ROW_H, vh = sc.clientHeight;
    sc.scrollTop = full <= MAXH ? keep * ROW_H : keep / Math.max(1, n - vh / ROW_H) * Math.max(1, MAXH - vh);
    render();
  }
}
// The row height is global (the grid is virtualised), so it is sized for the *visible* columns only: it is the number of lines (max WRAP_LINES)
// that the longest value among a sample of rows needs at the current column widths. Hidden columns are ignored; if nothing needs a second
// line the rows stay at the normal height.
function fitRows() {
  if (!wrapOn) return;
  const t = T;
  let lines = 1;
  if (t && t.nView) {
    const n = t.nView, idx = [], vis = [], CH = 7.6;
    for (let i = 0; i < Math.min(n, 200); i++) idx.push(i);
    for (let i = 200, step = Math.max(1, Math.floor(n / 200)); i < n; i += step) idx.push(i);
    for (let c = 0; c < t.nc; c++) if (!t.hidden[c]) vis.push([c, Math.max(4, Math.floor((t.widths[c] - 16) / CH))]);
    outer: for (const vi of idx) {
      const cells = rowCells(rowAt(vi));
      for (const [c, cpl] of vis) {
        const v = cells[c] || "";
        if (v.length <= cpl && v.indexOf("\n") < 0) continue;
        let l = 0;
        for (const seg of v.split("\n")) l += Math.max(1, Math.ceil(seg.length / cpl));
        if (l > lines) { lines = Math.min(l, WRAP_LINES); if (lines >= WRAP_LINES) break outer; }
      }
    }
  }
  document.documentElement.style.setProperty("--lines", lines);
  applyRowH(lines <= 1 ? 26 : lines * 18 + 8);
}
function setWrap(on) {
  wrapOn = on;
  $("layer").classList.toggle("wrap", on);
  $("bwrap").classList.toggle("on", on);
  lsSet("csvviewer.wrap", on ? "1" : "0");
  if (on) fitRows(); else applyRowH(26);
  if (T) render();
}
$("bwrap").addEventListener("click", () => setWrap(!wrapOn));
if (lsGet("csvviewer.wrap") === "1") setWrap(true);

// ---------------------------------------------------------------- toolbar, export, theme, input
let qtimer = 0;
$("q").addEventListener("input", () => { clearTimeout(qtimer); qtimer = setTimeout(() => T && refresh(), 250); });
$("bre").addEventListener("click", () => { reOn = !reOn; $("bre").classList.toggle("on", reOn); if (T && $("q").value) refresh(); });
$("bcase").addEventListener("click", () => { caseOn = !caseOn; $("bcase").classList.toggle("on", caseOn); if (T && $("q").value) refresh(); });
$("hdr").addEventListener("change", () => T && configure());
$("dsel").addEventListener("change", () => T && configure());

$("bexp").addEventListener("click", () => {
  const t = T;
  if (!t) return;
  const parts = [], vis = [];
  for (let c = 0; c < t.nc; c++) if (!t.hidden[c]) vis.push(c);
  if (vis.length === t.nc) {                         // all columns: keep the original text byte for byte
    if (t.base) parts.push(t.text.slice(t.st[0], t.en[0]));
    for (let i = 0; i < t.nView; i++) parts.push(recStr(rowAt(i)));
  } else {                                           // subset of columns: rebuild the lines with proper quoting
    const q = v => /["\n\r]/.test(v) || v.includes(t.delim) ? '"' + v.replace(/"/g, '""') + '"' : v;
    if (t.base) parts.push(vis.map(c => q(t.cols[c])).join(t.delim));
    for (let i = 0; i < t.nView; i++) { const cells = rowCells(rowAt(i)); parts.push(vis.map(c => q(cells[c] || "")).join(t.delim)); }
  }
  const blob = new Blob([parts.join("\n") + "\n"], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = t.name.replace(/\.[^.]+$/, "") + "-view.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Exported " + fmtN(t.nView) + " rows");
});

const THEMES = ["auto", "dark", "light"], THEME_LABEL = {auto: "◐ Auto", dark: "☾ Dark", light: "☀ Light"};
const THEME_TIP = {auto: "Theme: follows the system. Click: dark (indoor work)", dark: "Theme: dark, for indoor work. Click: light (outdoor / sunlight)", light: "Theme: light, high contrast for outdoor work. Click: follow the system"};
function applyTheme(v) {
  if (!THEMES.includes(v)) v = "auto";
  if (v === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  if (typeof trDraw === "function") trDraw();
  $("bthm").textContent = THEME_LABEL[v]; $("bthm").title = THEME_TIP[v]; $("bthm").dataset.v = v;
}
applyTheme(lsGet("csvviewer.theme"));
$("bthm").addEventListener("click", () => {
  const nx = THEMES[(THEMES.indexOf($("bthm").dataset.v) + 1) % THEMES.length];
  applyTheme(nx); lsSet("csvviewer.theme", nx);
});

$("bopen").addEventListener("click", () => $("file").click());
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("drag");
  const f = e.dataTransfer.files[0]; if (f) openFile(f);
});
(async () => {   // csvview.py serves the file at ?src=...
  const q = new URLSearchParams(location.search), src = q.get("src");
  if (!src) return;
  try {
    const r = await fetch(src);
    if (!r.ok) throw new Error("HTTP " + r.status);
    await readStream(r.body, +r.headers.get("content-length") || 0, q.get("name") || "data.csv");
  } catch (e) { setProg(null, "Could not load " + src + ": " + e); }
})();
window.addEventListener("paste", e => {
  if (e.target.matches("input, textarea")) return;
  const s = e.clipboardData && e.clipboardData.getData("text");
  if (s) { e.preventDefault(); loadText(s, "pasted.csv", s.length); }
});
